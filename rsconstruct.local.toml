# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md and the docs/ site render from tera.templates/, loading
# config/*.lua with load_lua (the pyanyzip pattern). Lua rather than the
# pydmt .py configs because rsconstruct's version_str() reads the lowercase
# `tup` global and pylint would reject lowercase module constants; .luacheckrc
# covers the intended top-level globals. The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]
